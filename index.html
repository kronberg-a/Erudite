<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light" />
    <script>
      // Apply the saved palette before the app renders or Android paints its bars.
      try {
        const theme = JSON.parse(localStorage.getItem("erudite:v3") || "null")?.settings?.theme === "dark" ? "dark" : "light";
        const background = theme === "dark" ? "#090D16" : "#F8FAFC";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
        document.querySelector('meta[name="color-scheme"]').content = theme;
      } catch { /* The app can still launch when local storage is unavailable. */ }
    </script>
    <meta
      name="description"
      content="Erudite. A considered space to build your vocabulary, one word at a time."
    />
    <title>Erudite — Make words your own</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./public/icons/icon-192.png" />
    <script data-pwa defer src="./public/pwa.js"></script>
    <link data-app-style rel="stylesheet" href="./public/standalone/app.css" />
    <script data-app-entry defer src="./public/standalone/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Erudite requires JavaScript. Enable it in your browser to study your
      vocabulary.</noscript
    >
  </body>
</html>
